]</text><text x="132.918" y="706.958" fill="#4D4538" font-size="14" textLength="186.587" font-family="'Times New Roman'">significa que el dato puede faltar.</text><text x="323.005" y="706.958" fill="#4D4538" font-size="14" textLength="14" font-weight="700" font-family="'Times New Roman'">0..</text><text x="337.005" y="706.958" fill="#4D4538" font-size="14" textLength="169.148" font-family="'Times New Roman'">* significa ninguno o muchos.</text><text x="69.528" y="723.057" fill="#4D4538" font-size="14" textLength="491.381" font-family="'Times New Roman'">Se omiten identificadores técnicos para mostrar únicamente lo que entiende el visitante.</text><line x1="66.028" y1="629.493" x2="591.623" y2="629.493" style="stroke:#4D4538;stroke-width:1;"/><line x1="66.028" y1="645.592" x2="591.623" y2="645.592" style="stroke:#4D4538;stroke-width:1;"/><line x1="66.028" y1="661.69" x2="591.623" y2="661.69" style="stroke:#4D4538;stroke-width:1;"/><line x1="66.028" y1="677.789" x2="591.623" y2="677.789" style="stroke:#4D4538;stroke-width:1;"/><line x1="66.028" y1="693.888" x2="591.623" y2="693.888" style="stroke:#4D4538;stroke-width:1;"/><line x1="66.028" y1="709.986" x2="591.623" y2="709.986" style="stroke:#4D4538;stroke-width:1;"/><line x1="66.028" y1="726.085" x2="591.623" y2="726.085" style="stroke:#4D4538;stroke-width:1;"/><line x1="66.028" y1="629.493" x2="66.028" y2="726.085" style="stroke:#4D4538;stroke-width:1;"/><line x1="591.623" y1="629.493" x2="591.623" y2="726.085" style="stroke:#4D4538;stroke-width:1;"/></g><?plantuml-src RLN1Sjis4BthAtQKczkeJcBBhZ8zo38vpOp7yTXEEssd1uXSoPY000k0ifMaC_s8_a2EEVYKcw_yatv97q1IekoSA64Nks_tlLruwHLJSdxssooXNvCJ-k-VV-cDNXXRY4pMNpNzLJ6LbXrhBsXDh5VrlI0bw9Rd0szAyeRcndjJK2ujPruQFN3lfIw55GNDHVP-QKsbyvbHnjApz3WzIAOz3tSZSdChzP8MGZdkMPJKxDSbax7-nlGCcHBEJRstSbvvVfCPVIK_CEttN79UY4hvr6X_BWgcuRKisD4vtzAbAOGUVjkt1Vbo_EhmPTfpcLfhRblZ-EHeF4uVmw6F0w8JOtEsdT_uwCTn4awVz62MJjC3M7vc0VydzkGWcILZs9z2-hlV7rwopfycFja_dXwSV3DncXwVfhk13quF3byT8_2Dp9aoQJF5pMykIh-cWj7yt0q